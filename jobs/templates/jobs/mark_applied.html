<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark as applied - job-search-tracker</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #1f2933; }
        h1 { font-size: 1.4rem; }
        .company { color: #52606d; margin-top: -0.5rem; }
        .done { color: #1e7b34; font-weight: 600; }
        .error { color: #b42318; font-weight: 600; }
        button { font-size: 1rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% else %}
        <h1>{{ job.title }}</h1>
        <p class="company">{{ job.company }} &middot; {{ job.get_source_display }}</p>
        {% if application %}
            <p class="done">Marked as applied on {{ application.applied_at|date:"M j, Y" }}.</p>
        {% else %}
            <form method="post">
                {% csrf_token %}
                <button type="submit">Mark as applied</button>
            </form>
        {% endif %}
        <p><a href="{{ job.url }}">Open the job posting</a></p>
    {% endif %}
</body>
</html>
